syntax = "proto3";

package qm.cron.v1;

option go_package = "github.com/hejw/qm-backend/api/qm/cron/v1;cronv1";

service CronService {
  rpc Get(GetRequest) returns (GetReply);
  rpc List(ListRequest) returns (ListReply);
  rpc Put(PutRequest) returns (PutReply);
  rpc PutIfAbsent(PutIfAbsentRequest) returns (PutReply);
  rpc Merge(MergeRequest) returns (MergeReply);
  rpc Delete(DeleteRequest) returns (DeleteReply);
  rpc Take(TakeRequest) returns (TakeReply);
  rpc ListDue(ListDueRequest) returns (ListDueReply);
  rpc ClaimSlot(ClaimSlotRequest) returns (ClaimSlotReply);
  rpc UnclaimSlot(UnclaimSlotRequest) returns (UnclaimSlotReply);
  rpc RecordFire(RecordFireRequest) returns (RecordFireReply);
  rpc MarkFired(MarkFiredRequest) returns (MarkFiredReply);
}

message Cron { string id = 1; bytes payload = 2; int64 next_fire_at_unix_ms = 3; }
message GetRequest { string id = 1; }
message GetReply { bool found = 1; Cron cron = 2; }
message ListRequest {}
message ListReply { repeated Cron crons = 1; }
message PutRequest { string id = 1; bytes payload = 2; }
message PutIfAbsentRequest { string id = 1; bytes payload = 2; }
message PutReply { Cron cron = 1; }
message MergeRequest { string id = 1; bytes patch = 2; repeated string remove_keys = 3; }
message MergeReply { bool found = 1; Cron cron = 2; }
message DeleteRequest { string id = 1; }
message DeleteReply {}
message TakeRequest { string id = 1; }
message TakeReply { bool found = 1; Cron cron = 2; }
message ListDueRequest { int64 now_unix_ms = 1; int32 limit = 2; }
message ListDueReply { repeated Cron crons = 1; }
message ClaimSlotRequest { string id = 1; int64 scheduled_at_unix_ms = 2; int64 fired_at_unix_ms = 3; int64 next_fire_at_unix_ms = 4; bool has_next_fire_at = 5; }
message ClaimSlotReply { bool claimed = 1; }
message UnclaimSlotRequest { string id = 1; int64 scheduled_at_unix_ms = 2; int64 fired_at_unix_ms = 3; int64 prior_last_fired_at_unix_ms = 4; bool has_prior_last_fired_at = 5; }
message UnclaimSlotReply { bool restored = 1; }
message RecordFireRequest { string id = 1; bytes entry = 2; }
message RecordFireReply { bool updated = 1; }
message MarkFiredRequest { string id = 1; int64 fired_at_unix_ms = 2; int64 next_fire_at_unix_ms = 3; bool has_next_fire_at = 4; }
message MarkFiredReply { bool updated = 1; }
