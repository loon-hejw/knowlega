syntax = "proto3";

package qm.runner.v1;

option go_package = "github.com/hejw/qm-backend/api/qm/runner/v1;runnerv1";

service RunnerService {
  rpc EnqueueRun(EnqueueRunRequest) returns (EnqueueRunReply);
  rpc GetRun(GetRunRequest) returns (GetRunReply);
  rpc GetActiveRunForSession(GetActiveRunForSessionRequest) returns (GetRunReply);
  rpc ListActiveSessionIDs(ListActiveSessionIDsRequest) returns (ListActiveSessionIDsReply);
  rpc ClaimRun(ClaimRunRequest) returns (ClaimRunReply);
  rpc ClaimRunByID(ClaimRunByIDRequest) returns (ClaimRunReply);
  rpc HeartbeatRun(HeartbeatRunRequest) returns (HeartbeatRunReply);
  rpc ReleaseRunLease(ReleaseRunLeaseRequest) returns (ReleaseRunLeaseReply);
  rpc FailRun(FailRunRequest) returns (FailRunReply);
  rpc AppendRunEvent(AppendRunEventRequest) returns (AppendRunEventReply);
  rpc CompleteRun(CompleteRunRequest) returns (CompleteRunReply);
  rpc SignalRun(SignalRunRequest) returns (SignalRunReply);
  rpc TakePendingSignals(TakePendingSignalsRequest) returns (TakePendingSignalsReply);
  rpc PendingSignalRunIDs(PendingSignalRunIDsRequest) returns (PendingSignalRunIDsReply);
  rpc PruneSignals(PruneSignalsRequest) returns (PruneSignalsReply);
  rpc AppendRunActivity(AppendRunActivityRequest) returns (AppendRunActivityReply);
  rpc ListRunActivity(ListRunActivityRequest) returns (ListRunActivityReply);
  rpc PruneRunActivity(PruneRunActivityRequest) returns (PruneRunActivityReply);
  rpc ReapExpiredRuns(ReapExpiredRunsRequest) returns (ReapExpiredRunsReply);
}

message EnqueueRunRequest {
  string session_id = 1;
  bytes payload = 2;
  string idempotency_key = 3;
  int32 max_attempts = 4;
}
message EnqueueRunReply {
  string run_id = 1;
  bool deduped = 2;
}

message GetRunRequest { string run_id = 1; }
message RunSnapshot {
  string run_id = 1;
  string session_id = 2;
  string status = 3;
  bytes payload = 4;
  bool has_result = 5;
  bytes result = 6;
  bool has_delivery_state = 7;
  bytes delivery_state = 8;
  string idempotency_key = 9;
  int32 attempts = 10;
  int32 error_attempts = 11;
  int32 max_attempts = 12;
  string lease_token = 13;
  bool has_lease_expires_at = 14;
  int64 lease_expires_at_unix_ms = 15;
  string worker_id = 16;
  int64 created_at_unix_ms = 17;
  bool has_started_at = 18;
  int64 started_at_unix_ms = 19;
  bool has_finished_at = 20;
  int64 finished_at_unix_ms = 21;
}
message GetRunReply { bool found = 1; RunSnapshot run = 2; }
message GetActiveRunForSessionRequest { string session_id = 1; }
message ListActiveSessionIDsRequest {}
message ListActiveSessionIDsReply { repeated string session_ids = 1; }

message ClaimRunRequest { string runner_id = 1; }
message ClaimRunByIDRequest { string run_id = 1; string runner_id = 2; }
message ClaimRunReply {
  string run_id = 1;
  string lease_token = 2;
  bytes payload = 3;
  string session_id = 4;
  int32 attempt = 5;
  int64 lease_expires_at_unix_ms = 6;
  int32 max_attempts = 7;
  int32 error_attempts = 8;
  int64 created_at_unix_ms = 9;
  int64 started_at_unix_ms = 10;
}
message HeartbeatRunRequest { string run_id = 1; string lease_token = 2; }
message HeartbeatRunReply { bool accepted = 1; }
message ReleaseRunLeaseRequest { string run_id = 1; string lease_token = 2; }
message ReleaseRunLeaseReply { bool accepted = 1; }
message FailRunRequest {
  string run_id = 1;
  string lease_token = 2;
  string reason = 3;
  bool retry = 4;
}
message FailRunReply { bool accepted = 1; bool requeued = 2; }
message AppendRunEventRequest { string run_id = 1; string lease_token = 2; int64 sequence = 3; string idempotency_key = 4; bytes payload = 5; }
message AppendRunEventReply { bool accepted = 1; }
message CompleteRunRequest { string run_id = 1; string lease_token = 2; string idempotency_key = 3; bytes result = 4; }
message CompleteRunReply { bool accepted = 1; }
message SignalRunRequest { string run_id = 1; bytes payload = 2; }
message SignalRunReply { bool accepted = 1; }
message RunSignal {
  int64 id = 1;
  string kind = 2;
  string text = 3;
  bytes payload = 4;
  int64 created_at_unix_ms = 5;
}
message TakePendingSignalsRequest { string run_id = 1; }
message TakePendingSignalsReply { repeated RunSignal signals = 1; }
message PendingSignalRunIDsRequest {}
message PendingSignalRunIDsReply { repeated string run_ids = 1; }
message PruneSignalsRequest { int64 older_than_unix_ms = 1; }
message PruneSignalsReply { int64 deleted = 1; }
message RunActivity {
  int64 sequence = 1;
  int64 parent_sequence = 2;
  bool has_parent_sequence = 3;
  string type = 4;
  bytes payload = 5;
  int64 created_at_unix_ms = 6;
}
message AppendRunActivityRequest { string run_id = 1; RunActivity activity = 2; }
message AppendRunActivityReply { bool accepted = 1; }
message ListRunActivityRequest { string run_id = 1; }
message ListRunActivityReply { repeated RunActivity activities = 1; }
message PruneRunActivityRequest { int64 older_than_unix_ms = 1; }
message PruneRunActivityReply { int64 deleted = 1; }
message ReapExpiredRunsRequest { int64 max_age_ms = 1; }
message ReapEvent {
  string run_id = 1;
  string session_id = 2;
  string worker_id = 3;
  int32 attempts = 4;
  int32 error_attempts = 5;
  string outcome = 6;
}
message ReapExpiredRunsReply {
  int32 requeued = 1;
  int32 parked = 2;
  repeated ReapEvent events = 3;
}
