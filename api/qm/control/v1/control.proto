syntax = "proto3";

package qm.control.v1;

option go_package = "github.com/loon-hejw/knowlega/api/qm/control/v1;controlv1";

service ControlService {
  rpc Health(HealthRequest) returns (HealthReply);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsReply);
  rpc CreateProject(CreateProjectRequest) returns (ProjectReply);
  rpc AddProjectMember(ProjectMemberRequest) returns (ProjectReply);
  rpc RemoveProjectMember(ProjectMemberRequest) returns (ProjectReply);
  rpc GetRuntimeConfiguration(RuntimeConfigurationRequest) returns (RuntimeConfigurationReply);
}

message CallerContext {
  string actor_id = 1;
  string scope_id = 2;
  string request_id = 3;
  string audience = 4;
}

message HealthRequest {}
message HealthReply { bool ok = 1; }
message ListProjectsRequest { CallerContext caller = 1; }
message ListProjectsReply { repeated Project projects = 1; }
message CreateProjectRequest { CallerContext caller = 1; string name = 2; }
message ProjectMemberRequest { CallerContext caller = 1; string project_id = 2; string member_id = 3; }
message ProjectReply { Project project = 1; }
message Project {
  string id = 1;
  string org_id = 2;
  string name = 3;
  string owner_id = 4;
  repeated string member_ids = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
}

message RuntimeConfigurationRequest {}
message RuntimeConfigurationReply {
  string revision = 1;
  string default_harness = 2;
  ModelRequestConfig request = 3;
  repeated ModelProvider providers = 4;
  SlackRuntimeConfig slack = 5;
  repeated OAuthClientConfig oauth_clients = 6;
  repeated RuntimeHarness harnesses = 7;
}
message ModelRequestConfig {
  int32 timeout_seconds = 1;
  int32 retries = 2;
  int32 max_input_chars = 3;
  int32 max_output_tokens = 4;
  bool disable_thinking = 5;
}
message ModelProvider {
  string id = 1;
  string protocol = 2;
  string base_url = 3;
  string api_key = 4;
  string user_agent = 5;
  string anthropic_version = 6;
  repeated RuntimeModel models = 7;
}
message RuntimeModel {
  string id = 1;
  string name = 2;
  int32 context_window = 3;
  int32 max_tokens = 4;
}
message RuntimeHarness {
  string id = 1;
  string provider = 2;
  repeated string model_ids = 3;
  string default_model = 4;
}
message SlackRuntimeConfig {
  string bot_token = 1;
  string app_token = 2;
  string team_id = 3;
  string team_name = 4;
}
message OAuthClientConfig {
  string provider = 1;
  string client_id = 2;
  string client_secret = 3;
  repeated string scopes = 4;
  repeated string redirect_allowlist = 5;
  string consent_mode = 6;
  string hosted_domain = 7;
}
