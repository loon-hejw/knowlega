syntax = "proto3";

package knowledge.v1;

option go_package = "github.com/hejw/qm-backend/api/knowledge/v1;knowledgev1";

service KnowledgeCore {
  rpc EnsureScope(EnsureScopeRequest) returns (ScopeStatus);
  rpc GetStatus(GetStatusRequest) returns (ScopeStatus);
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc ReadDocument(ReadDocumentRequest) returns (Document);
  rpc IngestSource(IngestSourceRequest) returns (IngestSourceReply);
  rpc SaveQueryAnswer(SaveQueryAnswerRequest) returns (SaveQueryAnswerReply);
}

message CallerContext {
  string org_id = 1;
  string scope_id = 2;
  string scope_kind = 3;
  string actor_id = 4;
  string request_id = 5;
  repeated string capabilities = 6;
  int64 expires_at_unix = 7;
}

message ScopeRef { string external_scope_id = 1; string kind = 2; }
message EnsureScopeRequest { ScopeRef scope = 1; string org_id = 2; string name = 3; }
message GetStatusRequest { ScopeRef scope = 1; CallerContext caller = 2; }
message ScopeStatus {
  ScopeRef scope = 1;
  string project_id = 2;
  string project_name = 3;
  string status = 4;
  int64 wiki_page_count = 6;
  int64 source_count = 7;
  bool ready = 8;
}
message QueryRequest {
  ScopeRef scope = 1;
  CallerContext caller = 2;
  string question = 3;
  string conversation_context = 4;
  int32 limit = 5;
}
message QueryResponse {
  string question = 1;
  string answer = 2;
  string status = 3;
  string suggested_writeback_title = 4;
  repeated QueryCitation citations = 5;
  repeated QueryResult results = 6;
  string incomplete_reason = 7;
  string query_id = 8;
  string query_plan = 9;
  bool can_write_back = 10;
}
message QueryCitation { string path = 1; string title = 2; string kind = 3; }
message QueryResult { string path = 1; string title = 2; string snippet = 3; int32 score = 4; string kind = 5; }
message SearchRequest { ScopeRef scope = 1; CallerContext caller = 2; string query = 3; int32 limit = 4; }
message SearchResponse { repeated QueryResult results = 1; }
message ReadDocumentRequest { ScopeRef scope = 1; CallerContext caller = 2; string path = 3; }
message Document { string path = 1; string title = 2; string kind = 3; string content = 4; }
message IngestSourceRequest {
  ScopeRef scope = 1;
  CallerContext caller = 2;
  string source_name = 3;
  bytes content = 4;
}
message IngestSourceReply {
  string raw_path = 1;
  bool skipped_unchanged = 2;
  repeated string generated_paths = 3;
  repeated string reviews = 4;
}
message SaveQueryAnswerRequest {
  ScopeRef scope = 1;
  CallerContext caller = 2;
  string query_id = 3;
  string title = 4;
}
message SaveQueryAnswerReply { string path = 1; }
