services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kbcore-postgres-local
    environment:
      POSTGRES_USER: kbcore
      POSTGRES_PASSWORD: kbcore
      POSTGRES_DB: kbcore
    ports:
      - "54329:5432"
    volumes:
      - kbcore-postgres-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbcore -d kbcore"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  kbcore-postgres-local:
